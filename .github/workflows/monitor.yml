name: Мониторинг фор NBA

# Точное расписание «раз в 30 минут»:
# GitHub будит нас каждые 5 минут (его расписание срабатывает с задержками
# и иногда пропускает слоты — бывало, что пропадали сразу :00 и :30), а скрипт
# сам решает: полноценная проверка линии — ровно ОДНА в получасовой интервал
# (:00–:29 и :30–:59 МСК), остальные запуски завершаются за пару секунд без
# обращения к сайту. Так проверка остаётся полчасовой даже при задержках,
# а разовый сбой сайта перепроверяется уже через 5 минут.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

env:
  # ручной запуск (Run workflow) всегда проверяет линию немедленно
  FORCE_CHECK: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

permissions:
  contents: write

# Не позволяем двум проверкам выполняться одновременно
concurrency:
  group: fora-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Проверка линий
        id: run
        run: |
          python3 marathon_fora_monitor.py --once --data-dir data || echo "failed=true" >> "$GITHUB_OUTPUT"

      - name: Сохранить результаты в репозиторий
        run: |
          git config user.name "fora-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Изменений для коммита нет"
          else
            git commit -m "проверка $(TZ=Europe/Moscow date +'%d.%m.%Y %H:%M') мск"
            git push
          fi

      - name: Пометить ошибку проверки
        if: steps.run.outputs.failed == 'true'
        run: exit 1
