name: Мониторинг фор NBA

# Точное расписание «раз в 30 минут», устойчивое к пропускам планировщика:
# 1) каждый запуск (плановый или ручной) становится «караульным»: живёт ~5,3 ч,
#    просыпается каждые 2 минуты и делает полноценную проверку линии РОВНО
#    ОДИН раз в получасовой интервал (:00–:29 и :30–:59 МСК) — решает сам
#    скрипт по метке last_check в data/state.json;
# 2) после каждой успешной проверки результаты сразу коммитятся в репозиторий;
#    если сайт недоступен — отдельный честный коммит «ошибка проверки …»
#    не чаще раза в 30 минут, а следующая попытка через 10 минут (без спама);
# 3) в начале смены караульный «передаёт смену» — запускает следующего
#    караульного (workflow_dispatch), поэтому проверки идут непрерывно даже
#    когда планировщик GitHub пропускает слоты (бывало — 11 из 12 подряд);
# 4) cron */5 остаётся резервом: если цепочка оборвётся, планировщик запустит
#    нового караульного.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Один караульный за раз; лишние запуски ждут своей очереди и подхватывают смену
concurrency:
  group: fora-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Передать смену следующему караульному
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              -d '{"ref":"main"}' \
              "${GITHUB_API_URL}/repos/${{ github.repository }}/actions/workflows/monitor.yml/dispatches")
            echo "передача смены -> HTTP $code"
            [ "$code" = "204" ] && break
            sleep 20
          done

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "Караульство ~5,3 ч: проверка раз в полчаса + коммит"
        id: guard
        env:
          # ручной запуск (Run workflow) проверяет линию немедленно,
          # дальнейшие проверки в этой смене — строго по получасовому слоту
          FORCE_CHECK: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          END=$(( $(date +%s) + 315*60 ))
          LAST=fail
          FORCE_ARGS=""
          if [ "$FORCE_CHECK" = "1" ]; then FORCE_ARGS="--force"; fi
          SLEEP=120
          NEXT_ERR_COMMIT=0
          while [ "$(date +%s)" -lt "$END" ]; do
            if python3 marathon_fora_monitor.py --once --data-dir data $FORCE_ARGS; then
              LAST=ok
              SLEEP=120
              MSG="проверка $(TZ=Europe/Moscow date +'%d.%m.%Y %H:%M') мск"
            else
              LAST=fail
              SLEEP=600
              MSG="ошибка проверки $(TZ=Europe/Moscow date +'%d.%m.%Y %H:%M') мск — сайт недоступен"
            fi
            FORCE_ARGS=""
            # страховка: вырезаем случайные маркеры git-конфликта из log.txt
            sed -i '/^<<<<<<</d; /^>>>>>>>/d; /^=======$/d' data/log.txt 2>/dev/null || true
            git config user.name "fora-monitor-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git pull --rebase --autostash origin main >/dev/null 2>&1 || true
            git add data/
            CAN_COMMIT=1
            NOW_TS=$(date +%s)
            if [ "$LAST" = "fail" ] && [ "$NOW_TS" -lt "$NEXT_ERR_COMMIT" ]; then
              CAN_COMMIT=0   # ошибки коммитим не чаще раза в 30 минут
            fi
            if [ "$CAN_COMMIT" = "1" ] && ! git diff --cached --quiet; then
              git commit -m "$MSG" >/dev/null
              git push || echo "[!] push не удался — повторим после следующей проверки"
              if [ "$LAST" = "fail" ]; then NEXT_ERR_COMMIT=$(( $(date +%s) + 1800 )); fi
            fi
            sleep $SLEEP
          done
          if [ "$LAST" = "fail" ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Пометить ошибку последней проверки
        if: steps.guard.outputs.failed == 'true'
        run: exit 1
